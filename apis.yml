aid: google-display-video-360
name: Google Display & Video 360
description: Display & Video 360 is Google's enterprise demand-side platform for programmatic
  media buying, sold through Google Marketing Platform. Its API automates the whole buying
  structure — partners and advertisers, campaigns, insertion orders, line items, ad groups and
  ads, creatives and ad assets, first-party and Customer Match audiences, guaranteed orders and
  inventory sources, and the assigned targeting options that decide what a line item actually
  buys — plus Structured Data File bulk export and import. One REST surface at
  displayvideo.googleapis.com, version v4, 179 operations across 16 resource families,
  described by a first-party Google API Discovery Document. Google OAuth 2.0 only; there is no
  API key, and an access token is not sufficient on its own — the calling Google Account must
  also hold a Display & Video 360 user profile with permission on the partner or advertiser
  being addressed.
