x-pointer-notes:
  StatusPage: Removed 2026-08-13. The previous pointer named https://status.cloud.google.com/,
    the Google Cloud Platform dashboard, which does not list displayvideo.googleapis.com — DV360
    is a Google Marketing Platform service. The only DV360-shaped candidate,
    developers.google.com/display-video/api/support/api-issues, was fetched (HTTP 200) and is a
    support-routing page with no incidents, dates or status indicators. Google publishes no
    status page for this API. Recorded as absent in
    lifecycle/google-display-video-360-lifecycle.yml rather than credited to a page that does
    not do the job.
  MCPServer: Deliberately NOT emitted. mcp/google-display-video-360-mcp.yml is a derived
    candidate tool list with deployment.mode = none — Google ships no Model Context Protocol
    server for Display & Video 360 (probed displayvideo.googleapis.com/mcp, HTTP 404; every
    DV360 MCP server on the market is third-party). An MCPServer pointer would assert an agent
    surface the provider does not operate. The artifact is wired as type MCP so it stays
    discoverable without claiming a deployed server.
  Idempotency: Deliberately NOT emitted. The Display & Video 360 API documents no idempotency
    key, request token or dedupe header, and none appears in the Discovery Document. See the
    idempotency block in conventions/google-display-video-360-conventions.yml.
  Compliance: Deliberately NOT emitted. Google's Marketing Platform ISO 27001 scope names seven
    products and Display & Video 360 is not among them; no DV360-scoped SOC or ISO certification
    was found. See conformance/google-display-video-360-conformance.yml.
  Authentication: The previous docs pointer, /display-video/api/guides/authentication, returned
    404 on 2026-08-13 and was corrected to the live guide at
    /display-video/api/guides/how-tos/authorizing.
