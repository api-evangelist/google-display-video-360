source: https://marketingplatform.google.com/about/display-video-360/
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file. It invented a Free /
  Pro / Enterprise ladder with a 1,000-request monthly quota and a 10 rpm free tier. None of that
  exists. Display & Video 360 has no self-serve tiers and no per-request API pricing.
description: >-
  Display & Video 360 publishes NO plans and NO price list. It is sold as an enterprise Google
  Marketing Platform product through Google sales or a Google Marketing Platform reseller, priced
  against media spend under a negotiated contract. The API is not separately metered or sold: API
  access is included with a DV360 seat and is governed by hard per-minute quotas rather than by a
  paid tier. There is no free tier, no trial, no usage-based API price, and no published rate card
  — the product page's only commercial call to action is "Contact us".
plan_count: 0
plans: []
pricing_model:
  type: enterprise-contract
  self_serve: false
  free_tier: false
  trial: false
  published_price_list: false
  billed_on: negotiated media spend / platform fee under a Google Marketing Platform agreement
  api_metered_separately: false
  note: >-
    Because the API is not sold by the call, the constraint that actually binds an integrator is
    quota, not price. See rate-limits/google-display-video-360-rate-limits.yml — 1500 total and
    700 write requests per minute per project, 300 total and 150 write per advertiser, with
    Google stating that increases cannot be requested.
access_prerequisites:
  - A Display & Video 360 account obtained through Google sales or a Google Marketing Platform reseller
  - A Google Cloud project with the Display & Video 360 API enabled
  - A Google Account holding a DV360 user profile with Read only, Standard or Admin permission
    on the partner or advertiser being addressed
