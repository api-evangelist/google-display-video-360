  # Targeting Options
  assignTargetingOption(
    advertiserId: Long!
    lineItemId: Long
    insertionOrderId: Long
    campaignId: Long
    targetingType: TargetingType!
    assignedTargetingOption: AssignedTargetingOptionInput!
