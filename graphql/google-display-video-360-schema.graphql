  # Inventory Sources
  createInventorySourceGroup(partnerId: Long!, displayName: String!): InventorySourceGroup!
  updateInventorySourceGroup(inventorySourceGroupId: Long!, partnerId: Long, advertiserId: Long, displayName: String!, updateMask: String!): InventorySourceGroup!
