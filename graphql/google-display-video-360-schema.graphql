  # Creatives
  createCreative(input: CreateCreativeInput!): Creative!
  updateCreative(input: UpdateCreativeInput!): Creative!
  deleteCreative(advertiserId: Long!, creativeId: Long!): Boolean!

  # Channels
  createChannel(input: CreateChannelInput!): Channel!
  updateChannel(channelId: Long!, advertiserId: Long, partnerId: Long, displayName: String!, updateMask: String!): Channel!
