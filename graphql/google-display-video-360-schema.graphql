  editInventorySourceGroupAssignedInventorySources(inventorySourceGroupId: Long!, partnerId: Long, advertiserId: Long, addedInventorySources: [Long!], removedInventorySources: [Long!]): [InventorySource!]!

  # First and Third Party Audiences
  createFirstAndThirdPartyAudience(advertiserId: Long!, displayName: String!, description: String, membershipDurationDays: Long, audienceType: String!): FirstAndThirdPartyAudience!
  updateFirstAndThirdPartyAudience(firstAndThirdPartyAudienceId: Long!, advertiserId: Long!, displayName: String, description: String, membershipDurationDays: Long, updateMask: String!): FirstAndThirdPartyAudience!
  editFirstAndThirdPartyAudienceMembers(firstAndThirdPartyAudienceId: Long!, advertiserId: Long!, addedContactInfoList: JSON, removedContactInfoList: JSON): FirstAndThirdPartyAudience!

  # Floodlight
  updateFloodlightGroup(floodlightGroupId: Long!, partnerId: Long!, displayName: String, updateMask: String!): FloodlightGroup!

  # Reporting / Queries
  createQuery(input: CreateQueryInput!): Query!
