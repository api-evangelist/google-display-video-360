  updateNegativeKeywordList(advertiserId: Long!, negativeKeywordListId: Long!, displayName: String!, updateMask: String!): NegativeKeywordList!
  deleteNegativeKeywordList(advertiserId: Long!, negativeKeywordListId: Long!): Boolean!
