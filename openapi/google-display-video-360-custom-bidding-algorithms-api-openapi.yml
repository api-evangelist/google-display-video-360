components:
  schemas:
    ScriptError:
      type: object
      description: An error message for a custom bidding script.
      properties:
        column:
          type: string
          format: int64
          description: The column number in the script where the error was thrown.
        line:
          type: string
          format: int64
          description: The line number in the script where the error was thrown.
        errorMessage:
          type: string
          description: The detailed error message.
        errorCode:
          type: string
          description: 'The type of error. Allowed values — `ERROR_CODE_UNSPECIFIED`: The script error is not specified or is unknown in this version.; `SYNTAX_ERROR`: The script has a syntax error.; `DEPRECATED_SYNTAX`: The script uses deprecated syntax.; `INTERNAL_ERROR`: Internal errors were thrown while processing the script.'
          enum:
          - ERROR_CODE_UNSPECIFIED
          - SYNTAX_ERROR
          - DEPRECATED_SYNTAX
          - INTERNAL_ERROR
    CustomBiddingModelDetails:
      type: object
      description: The details of a custom bidding algorithm model for a single shared advertiser.
      properties:
        advertiserId:
          type: string
          format: int64
          description: The unique ID of the relevant advertiser.
        readinessState:
          type: string
          description: 'The readiness state of custom bidding model. Allowed values — `READINESS_STATE_UNSPECIFIED`: State is not specified or is unknown in this version.; `READINESS_STATE_ACTIVE`: The model is trained and ready for serving.; `READINESS_STATE_INSUFFICIENT_DATA`: There is not enough data to train the serving model.; `READINESS_STATE_TRAINING`: The model is training and not ready for serving.; `READINESS_STATE_NO_VALID_SCRIPT`: A valid custom bidding script has not been provided with which to train the model. This state will only be applied to algorithms whose `custom_bidding_algorithm_type` is `SCRIPT_BASED`.; `READINESS_STATE_EVALUATION_FAILURE`: A valid script was provided but failed evaluation. This is applicable for scripts that could not be evaluated in the alloted time.'
          enum:
          - READINESS_STATE_UNSPECIFIED
          - READINESS_STATE_ACTIVE
          - READINESS_STATE_INSUFFICIENT_DATA
          - READINESS_STATE_TRAINING
          - READINESS_STATE_NO_VALID_SCRIPT
          - READINESS_STATE_EVALUATION_FAILURE
        suspensionState:
          type: string
          description: 'Output only. The suspension state of custom bidding model. Allowed values — `SUSPENSION_STATE_UNSPECIFIED`: State is not specified or is unknown in this version.; `SUSPENSION_STATE_ENABLED`: Model is enabled, either recently used, currently used or scheduled to be used. The algorithm is actively scoring impressions for this advertiser.; `SUSPENSION_STATE_DORMANT`: Model has not been used recently. Although the model still acts as `ENABLED`, it will eventually be suspended if not used.; `SUSPENSION_STATE_SUSPENDED`: Model is suspended from scoring impressions and cannot serve. If the algorithm is assigned to a line item under this advertiser or otherwise updated, it will switch back to the `ENABLED` state and require time to prepare the serving model again.'
          enum:
          - SUSPENSION_STATE_UNSPECIFIED
          - SUSPENSION_STATE_ENABLED
          - SUSPENSION_STATE_DORMANT
          - SUSPENSION_STATE_SUSPENDED
          readOnly: true
    CustomBiddingAlgorithmRules:
      type: object
      description: A single custom bidding algorithm rules.
      properties:
        active:
          type: boolean
          description: Output only. Whether the rules resource is currently being used for scoring by the parent algorithm.
          readOnly: true
        error:
          $ref: '#/components/schemas/CustomBiddingAlgorithmRulesError'
        name:
          type: string
          description: Output only. The resource name of the rules resource.
          readOnly: true
        customBiddingAlgorithmId:
          type: string
          format: int64
          description: Output only. The unique ID of the custom bidding algorithm that the rules resource belongs to.
          readOnly: true
        createTime:
          type: string
          format: google-datetime
          description: Output only. The time when the rules resource was created.
          readOnly: true
        state:
          type: string
          description: 'Output only. The state of the rules resource. Allowed values — `STATE_UNSPECIFIED`: The rules state are unspecified or unknown in this version.; `ACCEPTED`: The rules have been accepted for scoring impressions.; `REJECTED`: The rules have been rejected by backend pipelines. They may have errors.'
          enum:
          - STATE_UNSPECIFIED
          - ACCEPTED
          - REJECTED
          readOnly: true
        customBiddingAlgorithmRulesId:
          type: string
          format: int64
          description: Output only. The unique ID of the rules resource.
          readOnly: true
        rules:
          $ref: '#/components/schemas/CustomBiddingAlgorithmRulesRef'
    ListCustomBiddingAlgorithmRulesResponse:
      type: object
      properties:
        customBiddingRules:
          type: array
          description: The list of CustomBiddingAlgorithmRules resources. This list will be absent if empty.
          items:
            $ref: '#/components/schemas/CustomBiddingAlgorithmRules'
        nextPageToken:
          type: string
          description: A token to retrieve the next page of results. Pass this value in the page_token field in the subsequent call to `ListCustomBiddingAlgorithmRulesRequest` method to retrieve the next page of results. If this field is null, it means this is the last page.
    CustomBiddingAlgorithmRulesError:
      type: object
      description: An error message for a CustomBiddingAlgorithmRules resource.
      properties:
        errorCode:
          type: string
          description: 'The type of error. Allowed values — `ERROR_CODE_UNSPECIFIED`: The error is not specified or is unknown in this version.; `SYNTAX_ERROR`: The rules have a syntax error.; `CONSTRAINT_VIOLATION_ERROR`: The rules have a constraint violation error.; `INTERNAL_ERROR`: Internal errors were thrown while processing the rules.'
          enum:
          - ERROR_CODE_UNSPECIFIED
          - SYNTAX_ERROR
          - CONSTRAINT_VIOLATION_ERROR
          - INTERNAL_ERROR
    CustomBiddingAlgorithm:
      type: object
      description: A single custom bidding algorithm.
      properties:
        customBiddingAlgorithmType:
          type: string
          description: 'Required. Immutable. The type of custom bidding algorithm. Allowed values — `CUSTOM_BIDDING_ALGORITHM_TYPE_UNSPECIFIED`: Algorithm type is not specified or is unknown in this version.; `SCRIPT_BASED`: Algorithm generated through customer-uploaded custom bidding script files.; `RULE_BASED`: Algorithm based in defined rules. These rules are defined in the API using the AlgorithmRules object. This algorithm type is only available to allowlisted customers. Other customers attempting to use this type will receive an error.'
          enum:
          - CUSTOM_BIDDING_ALGORITHM_TYPE_UNSPECIFIED
          - SCRIPT_BASED
          - RULE_BASED
        name:
          type: string
          description: Output only. The resource name of the custom bidding algorithm.
          readOnly: true
        customBiddingAlgorithmId:
          type: string
          format: int64
          description: Output only. The unique ID of the custom bidding algorithm. Assigned by the system.
          readOnly: true
        displayName:
          type: string
          description: Required. The display name of the custom bidding algorithm. Must be UTF-8 encoded with a maximum size of 240 bytes.
        partnerId:
          type: string
          format: int64
          description: Immutable. The unique ID of the partner that owns the custom bidding algorithm.
        thirdPartyOptimizationPartner:
          type: string
          description: 'Optional. Immutable. Designates the third party optimization partner that manages this algorithm. Allowed values — `UNKNOWN`: Type value is not specified or is unknown in this version.; `SCIBIDS`: Third party data science service provider that DV3 partners/advertisers can partner with.; `ADELAIDE`: Third party attention measurement service provider that DV3 partners/advertisers can partner with.'
          enum:
          - UNKNOWN
          - SCIBIDS
          - ADELAIDE
        advertiserId:
          type: string
          format: int64
          description: Immutable. The unique ID of the advertiser that owns the custom bidding algorithm.
        sharedAdvertiserIds:
          type: array
          description: The IDs of the advertisers who have access to this algorithm. If advertiser_id is set, this field will only consist of that value. This field will not be set if the algorithm [`owner`](/display-video/api/reference/rest/v1/customBiddingAlgorithms#CustomBiddingAlgorithm.FIELDS.oneof_owner) is a partner and is being retrieved using an advertiser [`accessor`](/display-video/api/reference/rest/v1/customBiddingAlgorithms/list#body.QUERY_PARAMETERS.oneof_accessor).
          items:
            type: string
            format: int64
        modelDetails:
          type: array
          description: Output only. The details of custom bidding models for each advertiser who has access. This field may only include the details of the queried advertiser if the algorithm [`owner`](/display-video/api/reference/rest/v1/customBiddingAlgorithms#CustomBiddingAlgorithm.FIELDS.oneof_owner) is a partner and is being retrieved using an advertiser [`accessor`](/display-video/api/reference/rest/v1/customBiddingAlgorithms/list#body.QUERY_PARAMETERS.oneof_accessor).
          readOnly: true
          items:
            $ref: '#/components/schemas/CustomBiddingModelDetails'
        entityStatus:
          type: string
          description: 'Controls whether or not the custom bidding algorithm can be used as a bidding strategy. Accepted values are: * `ENTITY_STATUS_ACTIVE` * `ENTITY_STATUS_ARCHIVED` Allowed values — `ENTITY_STATUS_UNSPECIFIED`: Default value when status is not specified or is unknown in this version.; `ENTITY_STATUS_ACTIVE`: The entity is enabled to bid and spend budget.; `ENTITY_STATUS_ARCHIVED`: The entity is archived. Bidding and budget spending are disabled. An entity can be deleted after archived. Deleted entities cannot be retrieved.; `ENTITY_STATUS_DRAFT`: The entity is under draft. Bidding and budget spending are disabled.; `ENTITY_STATUS_PAUSED`: Bidding and budget spending are paused for the entity.; `ENTITY_STATUS_SCHEDULED_FOR_DELETION`: The entity is scheduled for deletion.'
          enum:
          - ENTITY_STATUS_UNSPECIFIED
          - ENTITY_STATUS_ACTIVE
          - ENTITY_STATUS_ARCHIVED
          - ENTITY_STATUS_DRAFT
          - ENTITY_STATUS_PAUSED
          - ENTITY_STATUS_SCHEDULED_FOR_DELETION
    CustomBiddingScriptRef:
      type: object
      description: The reference to the uploaded custom bidding script file.
      properties:
        resourceName:
          type: string
          description: A resource name to be used in media.download to Download the script files. Or media.upload to Upload the script files. Resource names have the format `customBiddingAlgorithms/{custom_bidding_algorithm_id}/scriptRef/{ref_id}`.
    ListCustomBiddingScriptsResponse:
      type: object
      properties:
        customBiddingScripts:
          type: array
          description: The list of custom bidding scripts. This list will be absent if empty.
          items:
            $ref: '#/components/schemas/CustomBiddingScript'
        nextPageToken:
          type: string
          description: A token to retrieve the next page of results. Pass this value in the page_token field in the subsequent call to `ListCustomBiddingScriptsRequest` method to retrieve the next page of results. If this field is null, it means this is the last page.
    CustomBiddingScript:
      type: object
      description: A single custom bidding script.
      properties:
        active:
          type: boolean
          description: Output only. Whether the script is currently being used for scoring by the parent algorithm.
          readOnly: true
        errors:
          type: array
          description: Output only. Error details of a rejected custom bidding script. This field will only be populated when state is REJECTED.
          readOnly: true
          items:
            $ref: '#/components/schemas/ScriptError'
        script:
          $ref: '#/components/schemas/CustomBiddingScriptRef'
        customBiddingScriptId:
          type: string
          format: int64
          description: Output only. The unique ID of the custom bidding script.
          readOnly: true
        createTime:
          type: string
          format: google-datetime
          description: Output only. The time when the script was created.
          readOnly: true
        state:
          type: string
          description: 'Output only. The state of the custom bidding script. Allowed values — `STATE_UNSPECIFIED`: The script state is not specified or is unknown in this version.; `ACCEPTED`: The script has been accepted for scoring impressions.; `REJECTED`: The script has been rejected by backend pipelines. It may have errors.; `PENDING`: The script is being processed for backend pipelines.'
          enum:
          - STATE_UNSPECIFIED
          - ACCEPTED
          - REJECTED
          - PENDING
          readOnly: true
        name:
          type: string
          description: Output only. The resource name of the custom bidding script.
          readOnly: true
        customBiddingAlgorithmId:
          type: string
          format: int64
          description: Output only. The unique ID of the custom bidding algorithm the script belongs to.
          readOnly: true
    CustomBiddingAlgorithmRulesRef:
      type: object
      description: The reference to the uploaded AlgorithmRules file. Retrieve the location to upload new AlgorithmRules file to using customBiddingAlgorithms.uploadRules.
      properties:
        resourceName:
          type: string
          description: A resource name to be used in media.download to download the rules files. Or media.upload to upload the rules files. Resource names have the format `customBiddingAlgorithms/{custom_bidding_algorithm_id}/rulesRef/{ref_id}`.
    ListCustomBiddingAlgorithmsResponse:
      type: object
      properties:
        customBiddingAlgorithms:
          type: array
          description: The list of custom bidding algorithms. This list will be absent if empty.
          items:
            $ref: '#/components/schemas/CustomBiddingAlgorithm'
        nextPageToken:
          type: string
          description: A token to retrieve the next page of results. Pass this value in the page_token field in the subsequent call to `ListCustomBiddingAlgorithmsRequest` method to retrieve the next page of results. If this field is null, it means this is the last page.
  securitySchemes:
    oauth2:
      type: oauth2
      description: Google OAuth 2.0. Authorization and token endpoints read from https://accounts.google.com/.well-known/openid-configuration.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          refreshUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/doubleclickbidmanager: View and manage your reports in DoubleClick Bid Manager
            https://www.googleapis.com/auth/display-video-user-management: 'Private Service: https://www.googleapis.com/auth/display-video-user-management'
            https://www.googleapis.com/auth/display-video: Create, see, edit, and permanently delete your Display & Video 360 entities and reports
            https://www.googleapis.com/auth/display-video-mediaplanning: Create, see, and edit Display & Video 360 Campaign entities and see billing invoices
