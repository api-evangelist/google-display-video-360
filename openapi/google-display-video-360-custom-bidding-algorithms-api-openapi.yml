        description: Required. The ID of the rules resource to fetch.
        required: true
      - name: advertiserId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the advertiser that owns the parent custom bidding algorithm.
      - name: partnerId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the partner that owns the parent custom bidding algorithm.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomBiddingAlgorithmRules'
      security:
      - oauth2:
        - https://www.googleapis.com/auth/display-video
      x-google-method-id: displayvideo.customBiddingAlgorithms.rules.get
  /v4/customBiddingAlgorithms/{customBiddingAlgorithmsId}/scripts:
    post:
      operationId: customBiddingAlgorithmsScriptsCreate
      summary: Creates a new custom bidding script.
      description: Creates a new custom bidding script. Returns the newly created script if successful. Requests creating a custom bidding script under an algorithm assigned to a line item will return an error.
      tags:
      - Custom Bidding Algorithms
      parameters:
      - name: customBiddingAlgorithmId
        in: path
        schema:
          type: string
          format: int64
          pattern: ^[^/]+$
        description: Required. The ID of the custom bidding algorithm that owns the script.
        required: true
      - name: partnerId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the partner that owns the parent custom bidding algorithm. Only this partner will have write access to this custom bidding script.
      - name: advertiserId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the advertiser that owns the parent custom bidding algorithm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomBiddingScript'
      responses:
        '200':
