      parameters:
      - name: customBiddingAlgorithmId
        in: path
        schema:
          type: string
          format: int64
          pattern: ^[^/]+$
        description: Required. The ID of the custom bidding algorithm owns the script.
        required: true
      - name: customBiddingScriptId
        in: path
        schema:
          type: string
          format: int64
          pattern: ^[^/]+$
        description: Required. The ID of the custom bidding script to fetch.
        required: true
      - name: advertiserId
        in: query
