          description: 'Output only. An enum for the DV360 content theme content classifier. Allowed values — `CONTENT_THEME_UNSPECIFIED`: Content theme is not specified or is unknown in this version.; `CONTENT_THEME_FIGHTING_VIDEO_GAMES`: Fighting video games.; `CONTENT_THEME_MATURE_GAMES`: Mature games.; `CONTENT_THEME_NOT_YET_DETERMINED_HEALTH_SOURCES`: Not yet determined health sources.; `CONTENT_THEME_NOT_YET_DETERMINED_NEWS_SOURCES`: Not yet determined news sources.; `CONTENT_THEME_POLITICS`: Politics.; `CONTENT_THEME_RECENT_NEWS`: Recent news.; `CONTENT_THEME_RELIGION`: Religion.; `CONTENT_THEME_UNPLEASANT_HEALTH_CONTENT`: Unpleasant health content.; `CONTENT_THEME_UNPLEASANT_NEWS`: Unpleasant news.'
          enum:
          - CONTENT_THEME_UNSPECIFIED
          - CONTENT_THEME_FIGHTING_VIDEO_GAMES
          - CONTENT_THEME_MATURE_GAMES
          - CONTENT_THEME_NOT_YET_DETERMINED_HEALTH_SOURCES
          - CONTENT_THEME_NOT_YET_DETERMINED_NEWS_SOURCES
          - CONTENT_THEME_POLITICS
          - CONTENT_THEME_RECENT_NEWS
          - CONTENT_THEME_RELIGION
          - CONTENT_THEME_UNPLEASANT_HEALTH_CONTENT
          - CONTENT_THEME_UNPLEASANT_NEWS
          readOnly: true
    UserRewardedContentTargetingOptionDetails:
      type: object
