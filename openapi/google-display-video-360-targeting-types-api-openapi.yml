YPE_VIDEO_PLAYER_SIZE`: Target a specific video player size for video ads.; `TARGETING_TYPE_USER_REWARDED_CONTENT`: Target user rewarded content for video ads.; `TARGETING_TYPE_PARENTAL_STATUS`: Target ads to a specific parental status (for example, parent or not a parent).; `TARGETING_TYPE_CONTENT_INSTREAM_POSITION`: Target video or audio ads in a specific content instream position (for example, pre-roll, mid-roll, or post-roll).; `TARGETING_TYPE_CONTENT_OUTSTREAM_POSITION`: Target ads in a specific content outstream position.; `TARGETING_TYPE_DEVICE_TYPE`: Target ads to a specific device type (for example, tablet or connected TV).; `TARGETING_TYPE_AUDIENCE_GROUP`: Target ads to an audience or groups of audiences. Singleton field, at most one can exist on a single Lineitem at a time.; `TARGETING_TYPE_BROWSER`: Target ads to specific web browsers (for example, Chrome).; `TARGETING_TYPE_HOUSEHOLD_INCOME`: Target ads to a specific household income range (for example, top 10%).; `TARGETING_TYPE_ON_SCREEN_POSITION`: Target ads in a specific on screen position.; `TARGETING_TYPE_THIRD_PARTY_VERIFIER`: Filter web sites through third party verification (for example, IAS or DoubleVerify).; `TARGETING_TYPE_DIGITAL_CONTENT_LABEL_EXCLUSION`: Filter web sites by specific digital content label ratings (for example, DL-MA: suitable only for mature audiences).; `TARGETING_TYPE_SENSITIVE_CATEGORY_EXCLUSION`: Filter website content by sensitive categories (for example, adult).; `TARGETING_TYPE_ENVIRONMENT`: Target ads to a specific environment (for example, web or app).; `TARGETING_TYPE_CARRIER_AND_ISP`: Target ads to a specific network carrier or internet service provider (ISP) (for example, Comcast or Orange).; `TARGETING_TYPE_OPERATING_SYSTEM`: Target ads to a specific operating system (for example, macOS).; `TARGETING_TYPE_DEVICE_MAKE_MODEL`: Target ads to a specific device make or model (for example, Roku or Samsung).; `TARGETING_TYPE_KEYWORD`: Target ads to a specific keyword (for example, dog or retriever).; `TARGETING_TYPE_NEGATIVE_KEYWORD_LIST`: Target ads to a specific negative keyword list.; `TARGETING_TYPE_VIEWABILITY`: Target ads to a specific viewability (for example, 80% viewable).; `TARGETING_TYPE_CATEGORY`: Target ads to a specific content category (for example, arts & entertainment).; `TARGETING_TYPE_INVENTORY_SOURCE`: Purchase impressions from specific deals and auction packages.; `TARGETING_TYPE_LANGUAGE`: Target ads to a specific language (for example, English or Japanese).; `TARGETING_TYPE_AUTHORIZED_SELLER_STATUS`: Target ads to ads.txt authorized sellers. If no targeting option of this type is assigned, the resource uses the "Authorized Direct Sellers and Resellers" option by default.; `TARGETING_TYPE_GEO_REGION`: Target ads to a specific regional location (for example, a city or state).; `TARGETING_TYPE_INVENTORY_SOURCE_GROUP`: Purchase impressions from a group of deals and auction packages.; `TARGETING_TYPE_EXCHANGE`: Purchase impressions from specific exchanges.; `TARGETING_TYPE_SUB_EXCHANGE`: Purchase impressions from specific sub-exchanges.; `TARGETING_TYPE_POI`: Target ads around a specific point of interest, such as a notable building, a street address, or latitude/longitude coordinates.; `TARGETING_TYPE_BUSINESS_CHAIN`: Target ads around locations of a business chain within a specific geo region.; `TARGETING_TYPE_CONTENT_DURATION`: Target ads to a specific video content duration.; `TARGETING_TYPE_CONTENT_STREAM_TYPE`: Target ads to a specific video content stream type.; `TARGETING_TYPE_NATIVE_CONTENT_POSITION`: Target ads to a specific native content position.; `TARGETING_TYPE_OMID`: Target ads in an Open Measurement enabled inventory.; `TARGETING_TYPE_AUDIO_CONTENT_TYPE`: Target ads to a specific audio content type.; `TARGETING_TYPE_CONTENT_GENRE`: Target ads to a specific content genre.; `TARGETING_TYPE_YOUTUBE_VIDEO`: Target ads to a specific YouTube video. Targeting of this type cannot be created or updated using the API. Although this targeting is inherited by child resources, **inherited targeting of this type will not be retrieveable**.; `TARGETING_TYPE_YOUTUBE_CHANNEL`: Target ads to a specific YouTube channel. Targeting of this type cannot be created or updated using the API. Although this targeting is inherited by child resources, **inherited targeting of this type will not be retrieveable**.; `TARGETING_TYPE_SESSION_POSITION`: Target ads to a serve it in a certain position of a session. Only supported for Ad Group resources under YouTube Programmatic Reservation line items. Targeting of this type cannot be created or updated using the API.; `TARGETING_TYPE_CONTENT_THEME_EXCLUSION`: Filter website content by content themes (for example, religion). Only supported for Advertiser resources. Targeting of this type cannot be created or updated using the API. This targeting is only inherited by child YouTube and Demand Gen line item resources.; `TARGETING_TYPE_YOUTUBE_CHANNEL_PACK`: Target ads to a specific YouTube channel pack.'
        required: true
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
        description: Requested page size. Must be between `1` and `200`. If unspecified will default to `100`. Returns error code `INVALID_ARGUMENT` if an invalid value is specified.
      - name: filter
        in: query
        schema:
          type: string
        description: 'Allows filtering by targeting option fields. Supported syntax: * Filter expressions are made up of one or more restrictions. * Restrictions can be combined by `OR` logical operators. * A restriction has the form of `{field} {operator} {value}`. * All fields must use the `EQUALS (=)` operator. Supported fields: * `carrierAndIspDetails.type` * `geoRegionDetails.geoRegionType` * `targetingOptionId` Examples: * All `GEO REGION` targeting options that belong to sub type `GEO_REGION_TYPE_COUNTRY` or `GEO_REGION_TYPE_STATE`: `geoRegionDetails.geoRegionType="GEO_REGION_TYPE_COUNTRY" OR geoRegionDetails.geoRegionType="GEO_REGION_TYPE_STATE"` * All `CARRIER AND ISP` targeting options that belong to sub type `CARRIER_AND_ISP_TYPE_CARRIER`: `carrierAndIspDetails.type="CARRIER_AND_ISP_TYPE_CARRIER"` The length of this field should be no more than 500 characters. Reference our [filter `LIST` requests](/display-video/api/guides/how-tos/filters) guide for more information.'
      - name: pageToken
        in: query
        schema:
          type: string
        description: A token identifying a page of results the server should return. Typically, this is the value of next_page_token returned from the previous call to `ListTargetingOptions` method. If not specified, the first page of results will be returned.
      - name: advertiserId
        in: query
        schema:
          type: string
          format: int64
        description: Required. The Advertiser this request is being made in the context of.
      - name: orderBy
        in: query
        schema:
          type: string
        description: 'Field by which to sort the list. Acceptable values are: * `targetingOptionId` (default) The default sorting order is ascending. To specify descending order for a field, a suffix "desc" should be added to the field name. Example: `targetingOptionId desc`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTargetingOptionsResponse'
      security:
      - oauth2:
        - https://www.googleapis.com/auth/display-video
      x-google-method-id: displayvideo.targetingTypes.targetingOptions.list
components:
  schemas:
    GenderTargetingOptionDetails:
      type: object
      description: Represents a targetable gender. This will be populated in the gender_details field of a TargetingOption when targeting_type is `TARGETING_TYPE_GENDER`.
      properties:
        gender:
          type: string
          description: 'Output only. The gender of an audience. Allowed values — `GENDER_UNSPECIFIED`: Default value when gender is not specified in this version. This enum is a place holder for default value and does not represent a real gender option.; `GENDER_MALE`: The audience gender is male.; `GENDER_FEMALE`: The audience gender is female.; `GENDER_UNKNOWN`: The audience gender is unknown.'
          enum:
          - GENDER_UNSPECIFIED
          - GENDER_MALE
          - GENDER_FEMALE
          - GENDER_UNKNOWN
          readOnly: true
    ListTargetingOptionsResponse:
      type: object
      description: Response message for ListTargetingOptions.
      properties:
        targetingOptions:
          type: array
          description: The list of targeting options. This list will be absent if empty.
          items:
            $ref: '#/components/schemas/TargetingOption'
        nextPageToken:
          type: string
          description: A token to retrieve the next page of results. Pass this value in the page_token field in the subsequent call to `ListTargetingOptions` method to retrieve the next page of results.
    NativeContentPositionTargetingOptionDetails:
      type: object
      description: Represents a targetable native content position. This will be populated in the native_content_position_details field when targeting_type is `TARGETING_TYPE_NATIVE_CONTENT_POSITION`.
      properties:
        contentPosition:
          type: string
          description: 'Output only. The content position. Allowed values — `NATIVE_CONTENT_POSITION_UNSPECIFIED`: Native content position is not specified in this version. This enum is a place holder for a default value and does not represent a real native content position.; `NATIVE_CONTENT_POSITION_UNKNOWN`: The native content position is unknown.; `NATIVE_CONTENT_POSITION_IN_ARTICLE`: Native content position is in-article, i.e., ads appear between the paragraphs of pages.; `NATIVE_CONTENT_POSITION_IN_FEED`: Native content position is in-feed, i.e., ads appear in a scrollable stream of content. A feed is typically editorial (e.g. a list of articles or news) or listings (e.g. a list of products or services).; `NATIVE_CONTENT_POSITION_PERIPHERAL`: Native content position is peripheral, i.e., ads appear outside of core content on pages, such as the right- or left-hand side of the page.; `NATIVE_CONTENT_POSITION_RECOMMENDATION`: Native content position is recommendation, i.e., ads appear in sections for recommended content.'
          enum:
          - NATIVE_CONTENT_POSITION_UNSPECIFIED
          - NATIVE_CONTENT_POSITION_UNKNOWN
          - NATIVE_CONTENT_POSITION_IN_ARTICLE
          - NATIVE_CONTENT_POSITION_IN_FEED
          - NATIVE_CONTENT_POSITION_PERIPHERAL
          - NATIVE_CONTENT_POSITION_RECOMMENDATION
          readOnly: true
    ContentInstreamPositionTargetingOptionDetails:
      type: object
      description: Represents a targetable content instream position, which could be used by video and audio ads. This will be populated in the content_instream_position_details field when targeting_type is `TARGETING_TYPE_CONTENT_INSTREAM_POSITION`.
      properties:
        contentInstreamPosition:
          type: string
          description: 'Output only. The content instream position. Allowed values — `CONTENT_INSTREAM_POSITION_UNSPECIFIED`: Content instream position is not specified in this version. This enum is a place holder for a default value and does not represent a real in stream ad position.; `CONTENT_INSTREAM_POSITION_PRE_ROLL`: Ads that play before streaming content.; `CONTENT_INSTREAM_POSITION_MID_ROLL`: Ads that play between the beginning and end of streaming content.; `CONTENT_INSTREAM_POSITION_POST_ROLL`: Ads that play at the end of streaming content.; `CONTENT_INSTREAM_POSITION_UNKNOWN`: Ads instream position is unknown.'
          enum:
          - CONTENT_INSTREAM_POSITION_UNSPECIFIED
          - CONTENT_INSTREAM_POSITION_PRE_ROLL
          - CONTENT_INSTREAM_POSITION_MID_ROLL
          - CONTENT_INSTREAM_POSITION_POST_ROLL
          - CONTENT_INSTREAM_POSITION_UNKNOWN
          readOnly: true
    CarrierAndIspTargetingOptionDetails:
      type: object
      description: Represents a targetable carrier or ISP. This will be populated in the carrier_and_isp_details field of a TargetingOption when targeting_type is `TARGETING_TYPE_CARRIER_AND_ISP`.
      properties:
        type:
          type: string
          description: 'Output only. The type indicating if it''s carrier or ISP. Allowed values — `CARRIER_AND_ISP_TYPE_UNSPECIFIED`: Default value when type is not specified or is unknown in this version.; `CARRIER_AND_ISP_TYPE_ISP`: Indicates this targeting resource refers to an ISP.; `CARRIER_AND_ISP_TYPE_CARRIER`: Indicates this targeting resource refers to a mobile carrier.'
          enum:
          - CARRIER_AND_ISP_TYPE_UNSPECIFIED
          - CARRIER_AND_ISP_TYPE_ISP
          - CARRIER_AND_ISP_TYPE_CARRIER
          readOnly: true
        displayName:
          type: string
          description: Output only. The display name of the carrier or ISP.
          readOnly: true
    SensitiveCategoryTargetingOptionDetails:
      type: object
      description: Represents a targetable sensitive category. This will be populated in the sensitive_category_details field of the TargetingOption when targeting_type is `TARGETING_TYPE_SENSITIVE_CATEGORY_EXCLUSION`.
      properties:
        sensitiveCategory:
          type: string
          description: 'Output only. An enum for the DV360 Sensitive category content classifier. Allowed values — `SENSITIVE_CATEGORY_UNSPECIFIED`: This enum is only a placeholder and doesn''t specify a DV360 sensitive category.; `SENSITIVE_CATEGORY_ADULT`: Adult or pornographic text, image, or video content.; `SENSITIVE_CATEGORY_DEROGATORY`: Content that may be construed as biased against individuals, groups, or organizations based on criteria such as race, religion, disability, sex, age, veteran status, sexual orientation, gender identity, or political affiliation. May also indicate discussion of such content, for instance, in an academic or journalistic context.; `SENSITIVE_CATEGORY_DOWNLOADS_SHARING`: Content related to audio, video, or software downloads.; `SENSITIVE_CATEGORY_WEAPONS`: Contains content related to personal weapons, including knives, guns, small firearms, and ammunition. Selecting either "weapons" or "sensitive social issues" will result in selecting both.; `SENSITIVE_CATEGORY_GAMBLING`: Contains content related to betting or wagering in a real-world or online setting.; `SENSITIVE_CATEGORY_VIOLENCE`: Content which may be considered graphically violent, gory, gruesome, or shocking, such as street fighting videos, accident photos, descriptions of torture, etc.; `SENSITIVE_CATEGORY_SUGGESTIVE`: Adult content, as well as suggestive content that''s not explicitly pornographic. This category includes all pages categorized as adult.; `SENSITIVE_CATEGORY_PROFANITY`: Prominent use of words considered indecent, such as curse words and sexual slang. Pages with only very occasional usage, such as news sites that might include such words in a quotation, are not included.; `SENSITIVE_CATEGORY_ALCOHOL`: Contains content related to alcoholic beverages, alcohol brands, recipes, etc.; `SENSITIVE_CATEGORY_DRUGS`: Contains content related to the recreational use of legal or illegal drugs, as well as to drug paraphernalia or cultivation.; `SENSITIVE_CATEGORY_TOBACCO`: Contains content related to tobacco and tobacco accessories, including lighters, humidors, ashtrays, etc.; `SENSITIVE_CATEGORY_POLITICS`: Political news and media, including discussions of social, governmental, and public policy.; `SENSITIVE_CATEGORY_RELIGION`: Content related to religious thought or beliefs.; `SENSITIVE_CATEGORY_TRAGEDY`: Content related to death, disasters, accidents, war, etc.; `SENSITIVE_CATEGORY_TRANSPORTATION_ACCIDENTS`: Content related to motor vehicle, aviation or other transportation accidents.; `SENSITIVE_CATEGORY_SENSITIVE_SOCIAL_ISSUES`: Issues that evoke strong, opposing views and spark debate. These include issues that are controversial in most countries and markets (such as abortion), as well as those that are controversial in specific countries and markets (such as immigration reform in the United States).; `SENSITIVE_CATEGORY_SHOCKING`: Content which may be considered shocking or disturbing, such as violent news stories, stunts, or toilet humor.; `SENSITIVE_CATEGORY_EMBEDDED_VIDEO`: YouTube videos embedded on websites outside of YouTube.com.; `SENSITIVE_CATEGORY_LIVE_STREAMING_VIDEO`: Video of live events streamed over the internet.'
          enum:
          - SENSITIVE_CATEGORY_UNSPECIFIED
          - SENSITIVE_CATEGORY_ADULT
          - SENSITIVE_CATEGORY_DEROGATORY
          - SENSITIVE_CATEGORY_DOWNLOADS_SHARING
          - SENSITIVE_CATEGORY_WEAPONS
          - SENSITIVE_CATEGORY_GAMBLING
          - SENSITIVE_CATEGORY_VIOLENCE
          - SENSITIVE_CATEGORY_SUGGESTIVE
          - SENSITIVE_CATEGORY_PROFANITY
          - SENSITIVE_CATEGORY_ALCOHOL
          - SENSITIVE_CATEGORY_DRUGS
          - SENSITIVE_CATEGORY_TOBACCO
          - SENSITIVE_CATEGORY_POLITICS
          - SENSITIVE_CATEGORY_RELIGION
          - SENSITIVE_CATEGORY_TRAGEDY
          - SENSITIVE_CATEGORY_TRANSPORTATION_ACCIDENTS
          - SENSITIVE_CATEGORY_SENSITIVE_SOCIAL_ISSUES
          - SENSITIVE_CATEGORY_SHOCKING
          - SENSITIVE_CATEGORY_EMBEDDED_VIDEO
          - SENSITIVE_CATEGORY_LIVE_STREAMING_VIDEO
          readOnly: true
    AppCategoryTargetingOptionDetails:
      type: object
      description: Represents a targetable collection of apps. A collection lets you target dynamic groups of related apps that are maintained by the platform, for example `All Apps/Google Play/Games`. This will be populated in the app_category_details field when targeting_type is `TARGETING_TYPE_APP_CATEGORY`.
      properties:
        displayName:
          type: string
          description: Output only. The name of the app collection.
          readOnly: true
    SearchTargetingOptionsRequest:
      type: object
      description: Request message for SearchTargetingOptions.
      properties:
        pageToken:
          type: string
          description: A token identifying a page of results the server should return. Typically, this is the value of next_page_token returned from the previous call to `SearchTargetingOptions` method. If not specified, the first page of results will be returned.
        poiSearchTerms:
          $ref: '#/components/schemas/PoiSearchTerms'
        pageSize:
          type: integer
          format: int32
          description: Requested page size. Must be between `1` and `200`. If unspecified will default to `100`. Returns error code `INVALID_ARGUMENT` if an invalid value is specified.
        geoRegionSearchTerms:
          $ref: '#/components/schemas/GeoRegionSearchTerms'
        businessChainSearchTerms:
          $ref: '#/components/schemas/BusinessChainSearchTerms'
        advertiserId:
          type: string
          format: int64
          description: Required. The Advertiser this request is being made in the context of.
    DigitalContentLabelTargetingOptionDetails:
      type: object
      description: Represents a targetable digital content label rating tier. This will be populated in the digital_content_label_details field of the TargetingOption when targeting_type is `TARGETING_TYPE_DIGITAL_CONTENT_LABEL_EXCLUSION`.
      properties:
        contentRatingTier:
          type: string
          description: 'Output only. An enum for the content label brand safety tiers. Allowed values — `CONTENT_RATING_TIER_UNSPECIFIED`: Content label is not specified in this version. This enum is a place holder for a default value and does not represent a real content rating.; `CONTENT_RATING_TIER_UNRATED`: Content that has not been labeled.; `CONTENT_RATING_TIER_GENERAL`: Content suitable for general audiences.; `CONTENT_RATING_TIER_PARENTAL_GUIDANCE`: Content suitable for most audiences with parental guidance.; `CONTENT_RATING_TIER_TEENS`: Content suitable for teen and older audiences.; `CONTENT_RATING_TIER_MATURE`: Content suitable only for mature audiences.; `CONTENT_RATING_TIER_FAMILIES`: Content suitable for family audiences. It is a subset of CONTENT_RATING_TIER_GENERAL. Only applicable to YouTube and Partners line items.'
          enum:
          - CONTENT_RATING_TIER_UNSPECIFIED
          - CONTENT_RATING_TIER_UNRATED
          - CONTENT_RATING_TIER_GENERAL
          - CONTENT_RATING_TIER_PARENTAL_GUIDANCE
          - CONTENT_RATING_TIER_TEENS
          - CONTENT_RATING_TIER_MATURE
          - CONTENT_RATING_TIER_FAMILIES
          readOnly: true
    LanguageTargetingOptionDetails:
      type: object
      description: Represents a targetable language. This will be populated in the language_details field when targeting_type is `TARGETING_TYPE_LANGUAGE`.
      properties:
        displayName:
          type: string
          description: Output only. The display name of the language (e.g., "French").
          readOnly: true
    ContentStreamTypeTargetingOptionDetails:
      type: object
      description: Represents a targetable content stream type. This will be populated in the content_stream_type_details field when targeting_type is `TARGETING_TYPE_CONTENT_STREAM_TYPE`.
      properties:
        contentStreamType:
          type: string
          description: 'Output only. The content stream type. Allowed values — `CONTENT_STREAM_TYPE_UNSPECIFIED`: Content stream type is not specified in this version. This enum is a place holder for a default value and does not represent a real content stream type.; `CONTENT_LIVE_STREAM`: The content is being live-streamed.; `CONTENT_ON_DEMAND`: The content is viewed on-demand.'
          enum:
          - CONTENT_STREAM_TYPE_UNSPECIFIED
          - CONTENT_LIVE_STREAM
          - CONTENT_ON_DEMAND
          readOnly: true
    AuthorizedSellerStatusTargetingOptionDetails:
      type: object
      description: Represents a targetable authorized seller status. This will be populated in the authorized_seller_status_details field when targeting_type is `TARGETING_TYPE_AUTHORIZED_SELLER_STATUS`.
      properties:
        authorizedSellerStatus:
          type: string
          description: 'Output only. The authorized seller status. Allowed values — `AUTHORIZED_SELLER_STATUS_UNSPECIFIED`: Default value when authorized seller status is not specified in this version. This enum is a placeholder for the default value, or "Authorized Direct Sellers and Resellers" in the UI.; `AUTHORIZED_SELLER_STATUS_AUTHORIZED_DIRECT_SELLERS_ONLY`: Only authorized sellers that directly own the inventory being monetized, as indicated by a DIRECT declaration in the ads.txt file. This value is equivalent to "Authorized Direct Sellers" in the UI.; `AUTHORIZED_SELLER_STATUS_AUTHORIZED_AND_NON_PARTICIPATING_PUBLISHERS`: All authorized sellers, including publishers that have not posted an ads.txt file. Display & Video 360 automatically disallows unauthorized sellers. This value is equivalent to "Authorized and Non-Participating Publishers" in the UI.'
          enum:
          - AUTHORIZED_SELLER_STATUS_UNSPECIFIED
          - AUTHORIZED_SELLER_STATUS_AUTHORIZED_DIRECT_SELLERS_ONLY
          - AUTHORIZED_SELLER_STATUS_AUTHORIZED_AND_NON_PARTICIPATING_PUBLISHERS
          readOnly: true
    PoiSearchTerms:
      type: object
      description: Search terms for POI targeting options.
      properties:
        poiQuery:
          type: string
          description: The search query for the desired POI name, street address, or coordinate of the desired POI. The query can be a prefix, e.g. "Times squar", "40.7505045,-73.99562", "315 W 44th St", etc.
    BusinessChainSearchTerms:
      type: object
      description: Search terms for Business Chain targeting options. At least one of the field should be populated.
      properties:
        businessChainQuery:
          type: string
          description: The search query for the desired business chain. The query must be the full name of the business, e.g. "KFC", "mercedes-benz".
        regionQuery:
          type: string
          description: The search query for the desired geo region, e.g. "Seattle", "United State".
    VideoPlayerSizeTargetingOptionDetails:
      type: object
      description: Represents a targetable video player size. This will be populated in the video_player_size_details field when targeting_type is `TARGETING_TYPE_VIDEO_PLAYER_SIZE`.
      properties:
        videoPlayerSize:
          type: string
          description: 'Output only. The video player size. Allowed values — `VIDEO_PLAYER_SIZE_UNSPECIFIED`: Video player size is not specified in this version. This enum is a place holder for a default value and does not represent a real video player size.; `VIDEO_PLAYER_SIZE_SMALL`: The dimensions of the video player are less than 400×300 (desktop), or up to 20% of screen covered (mobile).; `VIDEO_PLAYER_SIZE_LARGE`: The dimensions of the video player are between 400x300 and 1280x720 pixels (desktop), or 20% to 90% of the screen covered (mobile).; `VIDEO_PLAYER_SIZE_HD`: The dimensions of the video player are 1280×720 or greater (desktop), or over 90% of the screen covered (mobile).; `VIDEO_PLAYER_SIZE_UNKNOWN`: The dimensions of the video player are unknown.'
          enum:
          - VIDEO_PLAYER_SIZE_UNSPECIFIED
          - VIDEO_PLAYER_SIZE_SMALL
          - VIDEO_PLAYER_SIZE_LARGE
          - VIDEO_PLAYER_SIZE_HD
          - VIDEO_PLAYER_SIZE_UNKNOWN
          readOnly: true
    DeviceTypeTargetingOptionDetails:
      type: object
      description: Represents a targetable device type. This will be populated in the device_type_details field of a TargetingOption when targeting_type is `TARGETING_TYPE_DEVICE_TYPE`.
      properties:
        deviceType:
          type: string
          description: 'Output only. The device type that is used to be targeted. Allowed values — `DEVICE_TYPE_UNSPECIFIED`: Default value when device type is not specified in this version. This enum is a placeholder for default value and does not represent a real device type option.; `DEVICE_TYPE_COMPUTER`: Computer.; `DEVICE_TYPE_CONNECTED_TV`: Connected TV.; `DEVICE_TYPE_SMART_PHONE`: Smart phone.; `DEVICE_TYPE_TABLET`: Tablet.; `DEVICE_TYPE_CONNECTED_DEVICE`: Connected device.'
          enum:
          - DEVICE_TYPE_UNSPECIFIED
          - DEVICE_TYPE_COMPUTER
          - DEVICE_TYPE_CONNECTED_TV
          - DEVICE_TYPE_SMART_PHONE
          - DEVICE_TYPE_TABLET
          - DEVICE_TYPE_CONNECTED_DEVICE
          readOnly: true
    ContentGenreTargetingOptionDetails:
      type: object
      description: Represents a targetable content genre. This will be populated in the content_genre_details field when targeting_type is `TARGETING_TYPE_CONTENT_GENRE`.
      properties:
        displayName:
          type: string
          description: Output only. The display name of the content genre
          readOnly: true
    ContentOutstreamPositionTargetingOptionDetails:
      type: object
      description: Represents a targetable content outstream position, which could be used by display and video ads. This will be populated in the content_outstream_position_details field when targeting_type is `TARGETING_TYPE_CONTENT_OUTSTREAM_POSITION`.
      properties:
