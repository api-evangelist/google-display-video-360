      properties:
        userRewardedContent:
          type: string
          description: 'Output only. User rewarded content status for video ads. Allowed values — `USER_REWARDED_CONTENT_UNSPECIFIED`: User rewarded content is not specified or is unknown in this version.; `USER_REWARDED_CONTENT_USER_REWARDED`: Represents ads where the user will see a reward after viewing.; `USER_REWARDED_CONTENT_NOT_USER_REWARDED`: Represents all other ads besides user-rewarded.'
          enum:
