openapi: 3.2.0
info:
  title: Google Display & Video 360 Inventory Sources API
  description: Display & Video 360 API allows users to automate complex Display & Video 360 workflows, such as creating insertion orders and setting targeting options for individual line items. Derived mechanically from the first-party Google API Discovery Document at https://displayvideo.googleapis.com/$discovery/rest?version=v4 (revision 20260813).
  version: v4
  contact:
    name: Google
    url: https://developers.google.com/display-video/
  license:
    name: Google APIs Terms of Service
    url: https://developers.google.com/terms
  termsOfService: https://developers.google.com/terms
  x-google-discovery-revision: '20260813'
  x-google-discovery-document: https://displayvideo.googleapis.com/$discovery/rest?version=v4
servers:
- url: https://displayvideo.googleapis.com
  description: Display & Video 360 API server
security:
- oauth2:
  - https://www.googleapis.com/auth/display-video
tags:
- name: Inventory Sources
paths:
  /v4/inventorySources/{inventorySourcesId}:editInventorySourceReadWriteAccessors:
    post:
      operationId: inventorySourcesEditInventorySourceReadWriteAccessors
      summary: Edits read/write accessors of an inventory source.
      description: Edits read/write accessors of an inventory source. Returns the updated read_write_accessors for the inventory source.
      tags:
      - Inventory Sources
      parameters:
      - name: inventorySourceId
        in: path
        schema:
          type: string
          format: int64
          pattern: ^[^/]+$
        description: Required. The ID of inventory source to update.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditInventorySourceReadWriteAccessorsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySourceAccessors'
      security:
      - oauth2:
        - https://www.googleapis.com/auth/display-video
      x-google-method-id: displayvideo.inventorySources.editInventorySourceReadWriteAccessors
  /v4/inventorySources:
    get:
      operationId: inventorySourcesList
      summary: Lists inventory sources that are accessible to the current user.
      description: Lists inventory sources that are accessible to the current user. The order is defined by the order_by parameter. If a filter by entity_status is not specified, inventory sources with entity status `ENTITY_STATUS_ARCHIVED` will not be included in the results.
      tags:
      - Inventory Sources
      parameters:
      - name: partnerId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the partner that has access to the inventory source.
      - name: advertiserId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the advertiser that has access to the inventory source.
      - name: orderBy
        in: query
        schema:
          type: string
        description: 'Field by which to sort the list. Acceptable values are: * `displayName` (default) The default sorting order is ascending. To specify descending order for a field, a suffix "desc" should be added to the field name. For example, `displayName desc`.'
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
        description: Requested page size. Must be between `1` and `200`. If unspecified will default to `100`.
      - name: pageToken
        in: query
        schema:
          type: string
        description: A token identifying a page of results the server should return. Typically, this is the value of next_page_token returned from the previous call to `ListInventorySources` method. If not specified, the first page of results will be returned.
      - name: filter
        in: query
        schema:
          type: string
        description: 'Allows filtering by inventory source fields. Supported syntax: * Filter expressions are made up of one or more restrictions. * Restrictions can be combined by `AND` or `OR` logical operators. A sequence of restrictions implicitly uses `AND`. * A restriction has the form of `{field} {operator} {value}`. * All fields must use the `EQUALS (=)` operator. Supported fields: * `status.entityStatus` * `commitment` * `deliveryMethod` * `rateDetails.rateType` * `exchange` Examples: * All active inventory sources: `status.entityStatus="ENTITY_STATUS_ACTIVE"` * Inventory sources belonging to Google Ad Manager or Rubicon exchanges: `exchange="EXCHANGE_GOOGLE_AD_MANAGER" OR exchange="EXCHANGE_RUBICON"` The length of this field should be no more than 500 characters. Reference our [filter `LIST` requests](/display-video/api/guides/how-tos/filters) guide for more information.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInventorySourcesResponse'
      security:
      - oauth2:
        - https://www.googleapis.com/auth/display-video
      x-google-method-id: displayvideo.inventorySources.list
    post:
      operationId: inventorySourcesCreate
      summary: Creates a new inventory source.
      description: Creates a new inventory source. Returns the newly created inventory source if successful.
      tags:
      - Inventory Sources
      parameters:
      - name: advertiserId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the advertiser that the request is being made within.
      - name: partnerId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the partner that the request is being made within.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySource'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySource'
      security:
      - oauth2:
        - https://www.googleapis.com/auth/display-video
      x-google-method-id: displayvideo.inventorySources.create
  /v4/inventorySources/{inventorySourcesId}:
    patch:
      operationId: inventorySourcesPatch
      summary: Updates an existing inventory source.
      description: Updates an existing inventory source. Returns the updated inventory source if successful.
      tags:
      - Inventory Sources
      parameters:
      - name: inventorySourceId
        in: path
        schema:
          type: string
          format: int64
          pattern: ^[^/]+$
        description: Output only. The unique ID of the inventory source. Assigned by the system.
        required: true
      - name: partnerId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the partner that the request is being made within.
      - name: advertiserId
        in: query
        schema:
          type: string
          format: int64
        description: The ID of the advertiser that the request is being made within.
      - name: updateMask
        in: query
        schema:
          type: string
          format: google-fieldmask
        description: Required. The mask to control which fields to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySource'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySource'
      security:
      - oauth2:
        - https://www.googleapis.com/auth/display-video
      x-google-method-id: displayvideo.inventorySources.patch
    get:
      operationId: inventorySourcesGet
      summary: Gets an inventory source.
      description: Gets an inventory source.
      tags:
      - Inventory Sources
      parameters:
      - name: inventorySourceId
        in: path
        schema:
          type: string
          format: int64
          pattern: ^[^/]+$
        description: Required. The ID of the inventory source to fetch.
        required: true
      - name: advertiserId
        in: query
        schema:
          type: string
          format: int64
        description: Optional. The ID of the DV360 advertiser to which the fetched inventory source is permissioned. If the user only has access to the advertiser and not the parent partner, use this field to specify the relevant advertiser.
      - name: partnerId
        in: query
        schema:
          type: string
          format: int64
        description: Required. The ID of the DV360 partner to which the fetched inventory source is permissioned.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySource'
      security:
      - oauth2:
        - https://www.googleapis.com/auth/display-video
      x-google-method-id: displayvideo.inventorySources.get
components:
  schemas:
    Dimensions:
      type: object
      description: Dimensions.
      properties:
        widthPixels:
          type: integer
          format: int32
          description: The width in pixels.
        heightPixels:
          type: integer
          format: int32
          description: The height in pixels.
    InventorySourceAccessors:
      type: object
      description: The partner or advertisers with access to the inventory source.
      properties:
        advertisers:
          $ref: '#/components/schemas/InventorySourceAccessorsAdvertiserAccessors'
        partner:
          $ref: '#/components/schemas/InventorySourceAccessorsPartnerAccessor'
    EditInventorySourceReadWriteAccessorsRequestAdvertisersUpdate:
      type: object
      description: Update to the list of advertisers with read/write access to the inventory source.
      properties:
        addedAdvertisers:
          type: array
          description: The advertisers to add.
          items:
            type: string
            format: int64
        removedAdvertisers:
          type: array
          description: The advertisers to remove.
          items:
            type: string
            format: int64
    InventorySourceStatus:
      type: object
      description: The status related settings of the inventory source.
      properties:
        entityPauseReason:
          type: string
          description: The user-provided reason for pausing this inventory source. Must not exceed 100 characters. Only applicable when entity_status is set to `ENTITY_STATUS_PAUSED`.
        sellerStatus:
          type: string
          description: 'Output only. The status set by the seller for the inventory source. Only applicable for inventory sources synced directly from the publishers. Acceptable values are `ENTITY_STATUS_ACTIVE` and `ENTITY_STATUS_PAUSED`. Allowed values — `ENTITY_STATUS_UNSPECIFIED`: Default value when status is not specified or is unknown in this version.; `ENTITY_STATUS_ACTIVE`: The entity is enabled to bid and spend budget.; `ENTITY_STATUS_ARCHIVED`: The entity is archived. Bidding and budget spending are disabled. An entity can be deleted after archived. Deleted entities cannot be retrieved.; `ENTITY_STATUS_DRAFT`: The entity is under draft. Bidding and budget spending are disabled.; `ENTITY_STATUS_PAUSED`: Bidding and budget spending are paused for the entity.; `ENTITY_STATUS_SCHEDULED_FOR_DELETION`: The entity is scheduled for deletion.'
          enum:
          - ENTITY_STATUS_UNSPECIFIED
          - ENTITY_STATUS_ACTIVE
          - ENTITY_STATUS_ARCHIVED
          - ENTITY_STATUS_DRAFT
          - ENTITY_STATUS_PAUSED
          - ENTITY_STATUS_SCHEDULED_FOR_DELETION
          readOnly: true
        sellerPauseReason:
          type: string
          description: Output only. The seller-provided reason for pausing this inventory source. Only applicable for inventory sources synced directly from the publishers and when seller_status is set to `ENTITY_STATUS_PAUSED`.
          readOnly: true
        entityStatus:
          type: string
          description: 'Whether or not the inventory source is servable. Acceptable values are `ENTITY_STATUS_ACTIVE`, `ENTITY_STATUS_ARCHIVED`, and `ENTITY_STATUS_PAUSED`. Default value is `ENTITY_STATUS_ACTIVE`. Allowed values — `ENTITY_STATUS_UNSPECIFIED`: Default value when status is not specified or is unknown in this version.; `ENTITY_STATUS_ACTIVE`: The entity is enabled to bid and spend budget.; `ENTITY_STATUS_ARCHIVED`: The entity is archived. Bidding and budget spending are disabled. An entity can be deleted after archived. Deleted entities cannot be retrieved.; `ENTITY_STATUS_DRAFT`: The entity is under draft. Bidding and budget spending are disabled.; `ENTITY_STATUS_PAUSED`: Bidding and budget spending are paused for the entity.; `ENTITY_STATUS_SCHEDULED_FOR_DELETION`: The entity is scheduled for deletion.'
          enum:
          - ENTITY_STATUS_UNSPECIFIED
          - ENTITY_STATUS_ACTIVE
          - ENTITY_STATUS_ARCHIVED
          - ENTITY_STATUS_DRAFT
          - ENTITY_STATUS_PAUSED
          - ENTITY_STATUS_SCHEDULED_FOR_DELETION
        configStatus:
          type: string
          description: 'Output only. The configuration status of the inventory source. Only applicable for guaranteed inventory sources. Acceptable values are `INVENTORY_SOURCE_CONFIG_STATUS_PENDING` and `INVENTORY_SOURCE_CONFIG_STATUS_COMPLETED`. An inventory source must be configured (fill in the required fields, choose creatives, and select a default campaign) before it can serve. Allowed values — `INVENTORY_SOURCE_CONFIG_STATUS_UNSPECIFIED`: The approval status is not specified or is unknown in this version.; `INVENTORY_SOURCE_CONFIG_STATUS_PENDING`: The beginning state of a guaranteed inventory source. The inventory source in this state needs to be configured.; `INVENTORY_SOURCE_CONFIG_STATUS_COMPLETED`: The state after the buyer configures a guaranteed inventory source.'
          enum:
          - INVENTORY_SOURCE_CONFIG_STATUS_UNSPECIFIED
          - INVENTORY_SOURCE_CONFIG_STATUS_PENDING
          - INVENTORY_SOURCE_CONFIG_STATUS_COMPLETED
          readOnly: true
    TimeRange:
      type: object
      description: A time range.
      properties:
        startTime:
          type: string
          format: google-datetime
          description: Required. The lower bound of a time range, inclusive.
        endTime:
          type: string
          format: google-datetime
          description: Required. The upper bound of a time range, inclusive.
    RateDetails:
      type: object
      description: The rate related settings of the inventory source.
      properties:
        inventorySourceRateType:
          type: string
          description: 'The rate type. Acceptable values are `INVENTORY_SOURCE_RATE_TYPE_CPM_FIXED`, `INVENTORY_SOURCE_RATE_TYPE_CPM_FLOOR`, and `INVENTORY_SOURCE_RATE_TYPE_CPD`. Allowed values — `INVENTORY_SOURCE_RATE_TYPE_UNSPECIFIED`: The rate type is not specified or is unknown in this version.; `INVENTORY_SOURCE_RATE_TYPE_CPM_FIXED`: The rate type is CPM (Fixed).; `INVENTORY_SOURCE_RATE_TYPE_CPM_FLOOR`: The rate type is CPM (Floor).; `INVENTORY_SOURCE_RATE_TYPE_CPD`: The rate type is Cost per Day.; `INVENTORY_SOURCE_RATE_TYPE_CPH`: The rate type is Cost per Hour.; `INVENTORY_SOURCE_RATE_TYPE_FLAT`: The rate type is Flat.'
          enum:
          - INVENTORY_SOURCE_RATE_TYPE_UNSPECIFIED
          - INVENTORY_SOURCE_RATE_TYPE_CPM_FIXED
          - INVENTORY_SOURCE_RATE_TYPE_CPM_FLOOR
          - INVENTORY_SOURCE_RATE_TYPE_CPD
          - INVENTORY_SOURCE_RATE_TYPE_CPH
          - INVENTORY_SOURCE_RATE_TYPE_FLAT
        unitsPurchased:
          type: string
          format: int64
          description: Required for guaranteed inventory sources. The number of impressions guaranteed by the seller.
        minimumSpend:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Money'
    InventorySourceAccessorsAdvertiserAccessors:
      type: object
      description: The advertisers with access to the inventory source.
      properties:
        advertiserIds:
          type: array
          description: The IDs of the advertisers.
          items:
            type: string
            format: int64
    InventorySourceDisplayCreativeConfig:
      type: object
      description: The configuration for display creatives.
      properties:
        creativeSize:
          $ref: '#/components/schemas/Dimensions'
    InventorySourceAccessorsPartnerAccessor:
      type: object
      description: The partner with access to the inventory source.
      properties:
        partnerId:
          type: string
          format: int64
          description: The ID of the partner.
    InventorySource:
      type: object
      description: An inventory source.
      properties:
        creativeConfigs:
          type: array
          description: The creative requirements of the inventory source. Not applicable for auction packages.
          items:
            $ref: '#/components/schemas/CreativeConfig'
        readPartnerIds:
          type: array
          description: Output only. The IDs of partners with read-only access to the inventory source. All advertisers of partners in this field inherit read-only access to the inventory source.
          readOnly: true
          items:
            type: string
            format: int64
        commitment:
          type: string
          description: 'Whether the inventory source has a guaranteed or non-guaranteed delivery. Allowed values — `INVENTORY_SOURCE_COMMITMENT_UNSPECIFIED`: The commitment is not specified or is unknown in this version.; `INVENTORY_SOURCE_COMMITMENT_GUARANTEED`: The commitment is guaranteed delivery.; `INVENTORY_SOURCE_COMMITMENT_NON_GUARANTEED`: The commitment is non-guaranteed delivery.'
          enum:
          - INVENTORY_SOURCE_COMMITMENT_UNSPECIFIED
          - INVENTORY_SOURCE_COMMITMENT_GUARANTEED
          - INVENTORY_SOURCE_COMMITMENT_NON_GUARANTEED
        dealId:
          type: string
          description: The ID in the exchange space that uniquely identifies the inventory source. Must be unique across buyers within each exchange but not necessarily unique across exchanges.
        status:
          $ref: '#/components/schemas/InventorySourceStatus'
        inventorySourceType:
          type: string
          description: 'Denotes the type of the inventory source. Allowed values — `INVENTORY_SOURCE_TYPE_UNSPECIFIED`: The inventory source type is not specified or is unknown in this version.; `INVENTORY_SOURCE_TYPE_PRIVATE`: Private inventory source.; `INVENTORY_SOURCE_TYPE_AUCTION_PACKAGE`: Auction package.'
          enum:
          - INVENTORY_SOURCE_TYPE_UNSPECIFIED
          - INVENTORY_SOURCE_TYPE_PRIVATE
          - INVENTORY_SOURCE_TYPE_AUCTION_PACKAGE
        inventorySourceId:
          type: string
          format: int64
          description: Output only. The unique ID of the inventory source. Assigned by the system.
          readOnly: true
        inventorySourceProductType:
          type: string
          description: 'Output only. The product type of the inventory source, denoting the way through which it sells inventory. Allowed values — `INVENTORY_SOURCE_PRODUCT_TYPE_UNSPECIFIED`: The product type is not specified or is unknown in this version. Modifying inventory sources of this product type are not supported via API.; `PREFERRED_DEAL`: The inventory source sells inventory through Preferred Deal.; `PRIVATE_AUCTION`: The inventory source sells inventory through Private Auction.; `PROGRAMMATIC_GUARANTEED`: The inventory source sells inventory through Programmatic Guaranteed.; `TAG_GUARANTEED`: The inventory source sells inventory through Tag Guaranteed.; `YOUTUBE_RESERVE`: The inventory source sells inventory through YouTube Reserve.; `INSTANT_RESERVE`: The inventory source sells inventory through Instant Reserve. Modifying inventory sources of this product type are not supported via API.; `GUARANTEED_PACKAGE`: The inventory source sells inventory through Guaranteed Package. Modifying inventory sources of this product type are not supported via API.; `PROGRAMMATIC_TV`: The inventory source sells inventory through Programmtic TV. Modifying inventory sources of this product type are not supported via API.; `AUCTION_PACKAGE`: The inventory source sells inventory through Auction Package. Modifying inventory sources of this product type are not supported via API.'
          enum:
          - INVENTORY_SOURCE_PRODUCT_TYPE_UNSPECIFIED
          - PREFERRED_DEAL
          - PRIVATE_AUCTION
          - PROGRAMMATIC_GUARANTEED
          - TAG_GUARANTEED
          - YOUTUBE_RESERVE
          - INSTANT_RESERVE
          - GUARANTEED_PACKAGE
          - PROGRAMMATIC_TV
          - AUCTION_PACKAGE
          readOnly: true
        guaranteedOrderId:
          type: string
          description: Immutable. The ID of the guaranteed order that this inventory source belongs to. Only applicable when commitment is `INVENTORY_SOURCE_COMMITMENT_GUARANTEED`.
        updateTime:
          type: string
          format: google-datetime
          description: Output only. The timestamp when the inventory source was last updated. Assigned by the system.
          readOnly: true
        exchange:
          type: string
          description: 'The exchange to which the inventory source belongs. Allowed values — `EXCHANGE_UNSPECIFIED`: Exchange is not specified or is unknown in this version.; `EXCHANGE_GOOGLE_AD_MANAGER`: Google Ad Manager.; `EXCHANGE_APPNEXUS`: AppNexus.; `EXCHANGE_BRIGHTROLL`: BrightRoll Exchange for Video from Yahoo!.; `EXCHANGE_ADFORM`: Adform.; `EXCHANGE_ADMETA`: Admeta.; `EXCHANGE_ADMIXER`: Admixer.; `EXCHANGE_ADSMOGO`: AdsMogo.; `EXCHANGE_ADSWIZZ`: AdsWizz.; `EXCHANGE_BIDSWITCH`: BidSwitch.; `EXCHANGE_BRIGHTROLL_DISPLAY`: BrightRoll Exchange for Display from Yahoo!.; `EXCHANGE_CADREON`: Cadreon.; `EXCHANGE_DAILYMOTION`: Dailymotion.; `EXCHANGE_FIVE`: Five.; `EXCHANGE_FLUCT`: Fluct.; `EXCHANGE_FREEWHEEL`: FreeWheel SSP.; `EXCHANGE_GENIEE`: Geniee.; `EXCHANGE_GUMGUM`: GumGum.; `EXCHANGE_IMOBILE`: i-mobile.; `EXCHANGE_IBILLBOARD`: iBILLBOARD.; `EXCHANGE_IMPROVE_DIGITAL`: Improve Digital.; `EXCHANGE_INDEX`: Index Exchange.; `EXCHANGE_KARGO`: Kargo.; `EXCHANGE_MICROAD`: MicroAd.; `EXCHANGE_MOPUB`: MoPub.; `EXCHANGE_NEND`: Nend.; `EXCHANGE_ONE_BY_AOL_DISPLAY`: ONE by AOL: Display Market Place.; `EXCHANGE_ONE_BY_AOL_MOBILE`: ONE by AOL: Mobile.; `EXCHANGE_ONE_BY_AOL_VIDEO`: ONE by AOL: Video.; `EXCHANGE_OOYALA`: Ooyala.; `EXCHANGE_OPENX`: OpenX.; `EXCHANGE_PERMODO`: Permodo.; `EXCHANGE_PLATFORMONE`: Platform One.; `EXCHANGE_PLATFORMID`: PlatformId.; `EXCHANGE_PUBMATIC`: PubMatic.; `EXCHANGE_PULSEPOINT`: PulsePoint.; `EXCHANGE_REVENUEMAX`: RevenueMax.; `EXCHANGE_RUBICON`: Rubicon.; `EXCHANGE_SMARTCLIP`: SmartClip.; `EXCHANGE_SMARTRTB`: SmartRTB+.; `EXCHANGE_SMARTSTREAMTV`: SmartstreamTv.; `EXCHANGE_SOVRN`: Sovrn.; `EXCHANGE_SPOTXCHANGE`: SpotXchange.; `EXCHANGE_STROER`: Ströer SSP.; `EXCHANGE_TEADSTV`: TeadsTv.; `EXCHANGE_TELARIA`: Telaria.; `EXCHANGE_TVN`: TVN.; `EXCHANGE_UNITED`: United.; `EXCHANGE_YIELDLAB`: Yieldlab.; `EXCHANGE_YIELDMO`: Yieldmo.; `EXCHANGE_UNRULYX`: UnrulyX.; `EXCHANGE_OPEN8`: Open8.; `EXCHANGE_TRITON`: Triton.; `EXCHANGE_TRIPLELIFT`: TripleLift.; `EXCHANGE_TABOOLA`: Taboola.; `EXCHANGE_INMOBI`: InMobi.; `EXCHANGE_SMAATO`: Smaato.; `EXCHANGE_AJA`: Aja.; `EXCHANGE_SUPERSHIP`: Supership.; `EXCHANGE_NEXSTAR_DIGITAL`: Nexstar Digital.; `EXCHANGE_WAZE`: Waze.; `EXCHANGE_SOUNDCAST`: SoundCast.; `EXCHANGE_SHARETHROUGH`: Sharethrough.; `EXCHANGE_FYBER`: Fyber.; `EXCHANGE_RED_FOR_PUBLISHERS`: Red For Publishers.; `EXCHANGE_MEDIANET`: Media.net.; `EXCHANGE_TAPJOY`: Tapjoy.; `EXCHANGE_VISTAR`: Vistar.; `EXCHANGE_DAX`: DAX.; `EXCHANGE_JCD`: JCD.; `EXCHANGE_PLACE_EXCHANGE`: Place Exchange.; `EXCHANGE_APPLOVIN`: AppLovin.; `EXCHANGE_CONNATIX`: Connatix.; `EXCHANGE_RESET_DIGITAL`: Reset Digital.; `EXCHANGE_HIVESTACK`: Hivestack.; `EXCHANGE_DRAX`: Drax.; `EXCHANGE_APPLOVIN_GBID`: AppLovin MAX.; `EXCHANGE_FYBER_GBID`: DT Fairbid.; `EXCHANGE_UNITY_GBID`: Unity LevelPlay.; `EXCHANGE_CHARTBOOST_GBID`: Chartboost Mediation.; `EXCHANGE_ADMOST_GBID`: AdMost.; `EXCHANGE_TOPON_GBID`: TopOn.; `EXCHANGE_NETFLIX`: Netflix.; `EXCHANGE_CORE`: Core.; `EXCHANGE_COMMERCE_GRID`: Commerce Grid.; `EXCHANGE_SPOTIFY`: Spotify.; `EXCHANGE_TUBI`: Tubi.; `EXCHANGE_SNAP`: Snap.; `EXCHANGE_CADENT`: Cadent.; `EXCHANGE_EXTE`: Exte.'
          enum:
          - EXCHANGE_UNSPECIFIED
          - EXCHANGE_GOOGLE_AD_MANAGER
          - EXCHANGE_APPNEXUS
          - EXCHANGE_BRIGHTROLL
          - EXCHANGE_ADFORM
          - EXCHANGE_ADMETA
          - EXCHANGE_ADMIXER
          - EXCHANGE_ADSMOGO
          - EXCHANGE_ADSWIZZ
          - EXCHANGE_BIDSWITCH
