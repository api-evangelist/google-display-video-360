          - EXCHANGE_SNAP
          - EXCHANGE_CADENT
          - EXCHANGE_EXTE
        rateDetails:
          $ref: '#/components/schemas/RateDetails'
        publisherName:
          type: string
          description: The publisher/seller name of the inventory source.
        name:
          type: string
          description: Output only. The resource name of the inventory source.
          readOnly: true
        displayName:
          type: string
          description: The display name of the inventory source. Must be UTF-8 encoded with a maximum size of 240 bytes.
        readWriteAccessors:
          $ref: '#/components/schemas/InventorySourceAccessors'
        timeRange:
          $ref: '#/components/schemas/TimeRange'
        deliveryMethod:
          type: string
          description: 'The delivery method of the inventory source. * For non-guaranteed inventory sources, the only acceptable value is `INVENTORY_SOURCE_DELIVERY_METHOD_PROGRAMMATIC`. * For guaranteed inventory sources, acceptable values are `INVENTORY_SOURCE_DELIVERY_METHOD_TAG` and `INVENTORY_SOURCE_DELIVERY_METHOD_PROGRAMMATIC`. Allowed values — `INVENTORY_SOURCE_DELIVERY_METHOD_UNSPECIFIED`: The delivery method is not specified or is unknown in this version.; `INVENTORY_SOURCE_DELIVERY_METHOD_PROGRAMMATIC`: The delivery method is programmatic.; `INVENTORY_SOURCE_DELIVERY_METHOD_TAG`: The delivery method is tag.'
          enum:
          - INVENTORY_SOURCE_DELIVERY_METHOD_UNSPECIFIED
          - INVENTORY_SOURCE_DELIVERY_METHOD_PROGRAMMATIC
          - INVENTORY_SOURCE_DELIVERY_METHOD_TAG
        readAdvertiserIds:
          type: array
          description: Output only. The IDs of advertisers with read-only access to the inventory source.
          readOnly: true
          items:
            type: string
            format: int64
    InventorySourceVideoCreativeConfig:
      type: object
      description: The configuration for video creatives.
      properties:
        duration:
          type: string
          format: google-duration
          description: The duration requirements for the video creatives that can be assigned to the inventory source.
    Money:
      type: object
      description: Represents an amount of money with its currency type.
      properties:
        currencyCode:
          type: string
          description: The three-letter currency code defined in ISO 4217.
        units:
          type: string
          format: int64
          description: The whole units of the amount. For example if `currencyCode` is `"USD"`, then 1 unit is one US dollar.
        nanos:
          type: integer
          format: int32
          description: Number of nano (10^-9) units of the amount. The value must be between -999,999,999 and +999,999,999 inclusive. If `units` is positive, `nanos` must be positive or zero. If `units` is zero, `nanos` can be positive, zero, or negative. If `units` is negative, `nanos` must be negative or zero. For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
    ListInventorySourcesResponse:
      type: object
      properties:
        nextPageToken:
          type: string
          description: A token to retrieve the next page of results. Pass this value in the page_token field in the subsequent call to `ListInventorySources` method to retrieve the next page of results.
        inventorySources:
          type: array
          description: The list of inventory sources. This list will be absent if empty.
          items:
            $ref: '#/components/schemas/InventorySource'
    EditInventorySourceReadWriteAccessorsRequest:
      type: object
      description: Request message for InventorySourceService.EditInventorySourceReadWriteAccessors.
      properties:
        assignPartner:
          type: boolean
          description: Set the partner context as read/write accessor of the inventory source. This will remove all other current read/write advertiser accessors.
        advertisersUpdate:
          $ref: '#/components/schemas/EditInventorySourceReadWriteAccessorsRequestAdvertisersUpdate'
        partnerId:
          type: string
          format: int64
          description: Required. The partner context by which the accessors change is being made.
    CreativeConfig:
      type: object
      description: Creative requirements configuration for the inventory source.
      properties:
        displayCreativeConfig:
          $ref: '#/components/schemas/InventorySourceDisplayCreativeConfig'
        videoCreativeConfig:
          $ref: '#/components/schemas/InventorySourceVideoCreativeConfig'
        creativeType:
          type: string
          description: 'The type of creative that can be assigned to the inventory source. Only the following types are supported: * `CREATIVE_TYPE_STANDARD` * `CREATIVE_TYPE_VIDEO` Allowed values — `CREATIVE_TYPE_UNSPECIFIED`: Type value is not specified or is unknown in this version.; `CREATIVE_TYPE_STANDARD`: Standard display creative. Create and update methods are supported for this creative type if the hosting_source is one of the following: * `HOSTING_SOURCE_HOSTED` * `HOSTING_SOURCE_THIRD_PARTY`; `CREATIVE_TYPE_EXPANDABLE`: Expandable creative. Create and update methods are supported for this creative type if the hosting_source is `HOSTING_SOURCE_THIRD_PARTY`; `CREATIVE_TYPE_VIDEO`: Video creative. Create and update methods are supported for this creative type if the hosting_source is one of the following: * `HOSTING_SOURCE_HOSTED` * `HOSTING_SOURCE_THIRD_PARTY`; `CREATIVE_TYPE_NATIVE`: Native creative rendered by publishers with assets from advertiser. Create and update methods are supported for this creative type if the hosting_source is `HOSTING_SOURCE_HOSTED`; `CREATIVE_TYPE_TEMPLATED_APP_INSTALL`: Templated app install mobile creative (banner). Create and update methods are **not** supported for this creative type.; `CREATIVE_TYPE_NATIVE_SITE_SQUARE`: Square native creative. Create and update methods are supported for this creative type if the hosting_source is `HOSTING_SOURCE_HOSTED`; `CREATIVE_TYPE_TEMPLATED_APP_INSTALL_INTERSTITIAL`: Interstitial creative including both display and video. Create and update methods are **not** supported for this creative type.; `CREATIVE_TYPE_LIGHTBOX`: Responsive and expandable Lightbox creative. Create and update methods are **not** supported for this creative type.; `CREATIVE_TYPE_NATIVE_APP_INSTALL`: Native app install creative. Create and update methods are **not** supported for this creative type.; `CREATIVE_TYPE_NATIVE_APP_INSTALL_SQUARE`: Square native app install creative. Create and update methods are **not** supported for this creative type.; `CREATIVE_TYPE_AUDIO`: Audio creative. Create and update methods are supported for this creative type if the hosting_source is `HOSTING_SOURCE_HOSTED`; `CREATIVE_TYPE_PUBLISHER_HOSTED`: Publisher hosted creative. Create and update methods are **not** supported for this creative type.; `CREATIVE_TYPE_NATIVE_VIDEO`: Native video creative. Create and update methods are supported for this creative type if the hosting_source is `HOSTING_SOURCE_HOSTED`; `CREATIVE_TYPE_TEMPLATED_APP_INSTALL_VIDEO`: Templated app install mobile video creative. Create and update methods are **not** supported for this creative type.; `CREATIVE_TYPE_ASSET_BASED_CREATIVE`: Asset-based creative. Create and update methods are supported for this creative type if the hosting_source is `HOSTING_SOURCE_HOSTED`.'
          enum:
          - CREATIVE_TYPE_UNSPECIFIED
          - CREATIVE_TYPE_STANDARD
          - CREATIVE_TYPE_EXPANDABLE
          - CREATIVE_TYPE_VIDEO
          - CREATIVE_TYPE_NATIVE
          - CREATIVE_TYPE_TEMPLATED_APP_INSTALL
          - CREATIVE_TYPE_NATIVE_SITE_SQUARE
          - CREATIVE_TYPE_TEMPLATED_APP_INSTALL_INTERSTITIAL
          - CREATIVE_TYPE_LIGHTBOX
          - CREATIVE_TYPE_NATIVE_APP_INSTALL
          - CREATIVE_TYPE_NATIVE_APP_INSTALL_SQUARE
          - CREATIVE_TYPE_AUDIO
          - CREATIVE_TYPE_PUBLISHER_HOSTED
          - CREATIVE_TYPE_NATIVE_VIDEO
          - CREATIVE_TYPE_TEMPLATED_APP_INSTALL_VIDEO
          - CREATIVE_TYPE_ASSET_BASED_CREATIVE
  securitySchemes:
    oauth2:
      type: oauth2
      description: Google OAuth 2.0. Authorization and token endpoints read from https://accounts.google.com/.well-known/openid-configuration.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          refreshUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/doubleclickbidmanager: View and manage your reports in DoubleClick Bid Manager
            https://www.googleapis.com/auth/display-video-user-management: 'Private Service: https://www.googleapis.com/auth/display-video-user-management'
            https://www.googleapis.com/auth/display-video: Create, see, edit, and permanently delete your Display & Video 360 entities and reports
            https://www.googleapis.com/auth/display-video-mediaplanning: Create, see, and edit Display & Video 360 Campaign entities and see billing invoices
