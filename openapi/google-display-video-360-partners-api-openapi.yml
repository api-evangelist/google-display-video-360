          type: string
          description: 'Required. The unit of distance by which the targeting radius is measured. Allowed values — `DISTANCE_UNIT_UNSPECIFIED`: Type value is not specified or is unknown in this version.; `DISTANCE_UNIT_MILES`: Miles.; `DISTANCE_UNIT_KILOMETERS`: Kilometers.'
