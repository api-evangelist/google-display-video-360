webhooks:
  supported: false
  note: >-
    The API exposes no webhook, callback, push or event-subscription surface. Every state change
    must be discovered by polling. This is why no asyncapi/ artifact exists in this repo — an
    absent event surface, honestly recorded, not a missed harvest.
